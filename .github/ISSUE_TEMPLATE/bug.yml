name: Bug
description: Something works incorrectly
labels: ["type:bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: What happens
      description: Observed behaviour, error output (redact tokens and health data).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command, date, workflow run link.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] original symptom no longer occurs
