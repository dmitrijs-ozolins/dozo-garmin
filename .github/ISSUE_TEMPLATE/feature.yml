name: Feature
description: New capability or change in behaviour
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and why.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant files, ADRs, data, prior issues. Never paste raw health data — this repo is public.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done (checklist).
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
